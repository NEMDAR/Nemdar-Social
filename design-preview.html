<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEMDAR Social — التصميم المعتمد</title>
<style>body{margin:0;background:#f5f7fa;color:#101828;font:16px system-ui}header{background:#101828;color:white;padding:16px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}h1{font-size:20px;margin:0}select,button{padding:10px;border-radius:8px;border:1px solid #ccd4df;font:inherit}main{padding:12px}p{margin:6px 12px 16px;color:#475467}iframe{width:100%;height:calc(100vh - 150px);border:1px solid #ddd;background:white}a{color:#93c5fd}.mobile{max-width:390px;display:block;margin:auto}</style>
<header><h1>نِمدار سوشيال</h1><select id="screens" aria-label="اختر الشاشة"></select><button id="size">عرض بعرض الموبايل</button><a id="original" target="_blank" rel="noopener">فتح الأصل</a></header>
<main><p>معاينة ملفات Stitch الأصلية • بيانات توضيحية • الأزرار داخل التصاميم ليست ربطاً فعلياً بالمنصات.</p><iframe id="preview" title="معاينة التصميم" sandbox="allow-scripts allow-same-origin"></iframe></main>
<script type="module">const list=await fetch('./screens.json').then(r=>r.json());const select=document.querySelector('#screens'), frame=document.querySelector('#preview');for(const s of list){const o=document.createElement('option');o.value=s.file;o.textContent=s.title;select.append(o)}function show(){frame.src=select.value;document.querySelector('#original').href=select.value}select.onchange=show;document.querySelector('#size').onclick=()=>frame.classList.toggle('mobile');show();</script></html>
